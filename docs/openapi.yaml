openapi: 3.0.3
info:
  title: Sleman Akses API
  version: 1.0.0
  description: |-
    REST API untuk aplikasi mobile Sleman Akses.

    Catatan penyimpanan foto: aplikasi menggunakan Cloudinary untuk menyimpan foto laporan.
    Environment variables yang relevan: `CLOUDINARY_CLOUD_NAME`, `CLOUDINARY_API_KEY`, `CLOUDINARY_API_SECRET`, `CLOUDINARY_FOLDER`.
servers:
  - url: http://localhost:8000/api/v1
tags:
  - name: Auth
    description: Endpoint autentikasi (register, login, logout)
  - name: Profile
    description: Endpoint profil pengguna
  - name: Categories
    description: Daftar kategori fasilitas
  - name: Map
    description: Data lokasi peta
  - name: Reports
    description: CRUD laporan dan upload foto (foto di-upload ke Cloudinary)
  - name: Media
    description: Manajemen foto pengguna (list, delete) — terintegrasi dengan Cloudinary
  - name: News
    description: Endpoint berita dan materi edukasi aksesibilitas fasilitas publik
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrasi pengguna
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/login:
    post:
      tags: [Auth]
      summary: Login pengguna
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "401":
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout pengguna
      responses:
        "200":
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /profile:
    get:
      tags: [Profile]
      summary: Ambil profil pengguna
      responses:
        "200":
          description: Profil berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      tags: [Profile]
      summary: Update profil pengguna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profil berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"
  /categories:
    get:
      tags: [Categories]
      summary: Daftar kategori fasilitas
      security: []
      responses:
        "200":
          description: Berhasil mengambil kategori
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
  /map:
    get:
      tags: [Map]
      summary: Daftar lokasi peta yang sudah dipublish
      security: []
      responses:
        "200":
          description: Berhasil mengambil data peta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapLocationListResponse"
  /map/{id}:
    get:
      tags: [Map]
      summary: Detail lokasi peta
      security: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Berhasil mengambil detail lokasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapLocationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /reports:
    get:
      tags: [Reports]
      summary: Daftar laporan milik user
      parameters:
        - in: query
          name: per_page
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Berhasil mengambil daftar laporan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [Reports]
      summary: Buat laporan baru
      description: |-
        Buat laporan baru dengan foto. Foto akan di-resize di server dan di-upload ke Cloudinary.
        Field `photo` harus berupa file (`multipart/form-data`). Respons `photo_url` pada data
        adalah URL HTTPS langsung dari Cloudinary (secure_url).
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          description: "UUID v4 unik yang dihasilkan klien mobile untuk mencegah duplikasi pelaporan (offline-first sync)."
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/StoreReportRequest"
            encoding:
              photo:
                contentType: image/jpeg, image/png
      responses:
        "201":
          description: Laporan berhasil dikirim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
              examples:
                success:
                  value:
                    success: true
                    message: Laporan berhasil dikirim.
                    data:
                      report_id: 123
                      latitude: -7.75
                      longitude: 110.366
                      photo_url: "https://res.cloudinary.com/<cloud_name>/image/upload/v167xxxx/reports/123/uuid.jpg"
                      timestamp: "2026-05-21T12:34:56Z"
                      validation_status: pending
                      details: []
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"
  /reports/{id}:
    get:
      tags: [Reports]
      summary: Detail laporan
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Berhasil mengambil detail laporan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /media:
    get:
      tags: [Media]
      summary: Daftar foto milik user
      description: Ambil daftar foto yang di-upload user. Mengembalikan `report_id`, `photo_url`, dan `timestamp`.
      responses:
        "200":
          description: Berhasil mengambil daftar foto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /media/{id}:
    delete:
      tags: [Media]
      summary: Hapus foto milik user
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Foto berhasil dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          description: Foto tidak ditemukan pada laporan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /news:
    get:
      tags: [News]
      summary: Daftar berita dan materi edukasi aksesibilitas
      security: []
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Filter kategori artikel
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Pencarian kata kunci pada judul atau ringkasan
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Berhasil mengambil data berita
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsListResponse"

  /news/{id}:
    get:
      tags: [News]
      summary: Detail artikel berita / materi edukasi
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID atau slug artikel berita
      responses:
        "200":
          description: Berhasil mengambil detail berita
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: integer
  responses:
    ValidationError:
      description: Validasi gagal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    Unauthenticated:
      description: Autentikasi diperlukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    RegisterRequest:
      type: object
      required: [full_name, email, password, password_confirmation]
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    UpdateProfileRequest:
      type: object
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password
    StoreReportRequest:
      type: object
      required: [latitude, longitude, photo, categories]
      properties:
        uuid:
          type: string
          format: uuid
          nullable: true
          description: "UUID v4 unik laporan untuk rekonsiliasi idempotensi offline-first."
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        photo:
          type: string
          format: binary
          description: "File gambar (jpg/jpeg/png). Di-upload ke Cloudinary; server akan mengembalikan `photo_url` sebagai secure HTTPS URL. Max 5MB."
        categories:
          type: array
          items:
            $ref: "#/components/schemas/ReportCategoryInput"
    ReportCategoryInput:
      type: object
      required: [id, available]
      properties:
        id:
          type: integer
        available:
          type: boolean
    SuccessMessage:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil
        data:
          nullable: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Terjadi kesalahan
        errors:
          nullable: true
    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            message:
              example: Validasi gagal.
            errors:
              type: object
    AuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login berhasil.
        data:
          type: object
          properties:
            token:
              type: string
            user:
              $ref: "#/components/schemas/User"
    ProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil mengambil profil.
        data:
          $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        user_id:
          type: integer
        full_name:
          type: string
        email:
          type: string
        role:
          type: string
        created_at:
          type: string
          format: date-time
    Category:
      type: object
      properties:
        category_id:
          type: integer
        facility_name:
          type: string
        icon_marker:
          type: string
    CategoryListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil mengambil kategori.
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    MediaItem:
      type: object
      properties:
        report_id:
          type: integer
        photo_url:
          type: string
        timestamp:
          type: string
          format: date-time
    MediaListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil mengambil daftar foto.
        data:
          type: array
          items:
            $ref: "#/components/schemas/MediaItem"
    ReportDetail:
      type: object
      properties:
        category:
          type: string
        icon_marker:
          type: string
        availability_status:
          type: boolean
    Report:
      type: object
      properties:
        report_id:
          type: integer
        uuid:
          type: string
          format: uuid
          nullable: true
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        photo_url:
          type: string
          description: "HTTPS URL dari Cloudinary (secure_url)."
        timestamp:
          type: string
          format: date-time
        validation_status:
          type: string
          enum: [pending, approved, rejected]
        details:
          type: array
          items:
            $ref: "#/components/schemas/ReportDetail"
    ReportResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Laporan berhasil dikirim.
        data:
          $ref: "#/components/schemas/Report"
    ReportListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil mengambil daftar laporan.
        data:
          type: object
          properties:
            reports:
              type: array
              items:
                $ref: "#/components/schemas/Report"
            pagination:
              $ref: "#/components/schemas/Pagination"
    MapFacility:
      type: object
      properties:
        category:
          type: string
        icon_marker:
          type: string
        available:
          type: boolean
    MapLocation:
      type: object
      properties:
        location_id:
          type: integer
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        publish_date:
          type: string
          format: date-time
        photo_url:
          type: string
        reported_by:
          type: string
        facilities:
          type: array
          items:
            $ref: "#/components/schemas/MapFacility"
    MapLocationResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil mengambil detail lokasi.
        data:
          $ref: "#/components/schemas/MapLocation"
    MapLocationListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil mengambil data peta.
        data:
          type: array
          items:
            $ref: "#/components/schemas/MapLocation"
    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    NewsItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        summary:
          type: string
        category:
          type: string
          example: Edukasi & Kesadaran
        detected_facilities:
          type: array
          items:
            type: string
          example: ["Ramp", "Toilet Difabel"]
        image_url:
          type: string
          nullable: true
        author_name:
          type: string
        source_name:
          type: string
          nullable: true
        source_url:
          type: string
          nullable: true
        is_scraped:
          type: boolean
        ai_processed:
          type: boolean
          example: true
        published_at:
          type: string
          format: date-time
          nullable: true
        views_count:
          type: integer
          example: 42
        reading_time_minutes:
          type: integer
          example: 3
    NewsDetail:
      allOf:
        - $ref: "#/components/schemas/NewsItem"
        - type: object
          properties:
            content:
              type: string
    NewsListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Data berita berhasil diambil.
        data:
          type: array
          items:
            $ref: "#/components/schemas/NewsItem"
        meta:
          $ref: "#/components/schemas/Pagination"
    NewsDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Detail berita berhasil diambil.
        data:
          $ref: "#/components/schemas/NewsDetail"

