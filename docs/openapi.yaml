openapi: 3.0.3
info:
  title: Sleman Akses API
  version: 1.0.0
  description: REST API untuk aplikasi mobile Sleman Akses
servers:
  - url: http://localhost:8000/api/v1
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrasi pengguna
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/login:
    post:
      tags: [Auth]
      summary: Login pengguna
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "401":
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout pengguna
      responses:
        "200":
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /profile:
    get:
      tags: [Profile]
      summary: Ambil profil pengguna
      responses:
        "200":
          description: Profil berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      tags: [Profile]
      summary: Update profil pengguna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profil berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"
  /categories:
    get:
      tags: [Categories]
      summary: Daftar kategori fasilitas
      security: []
      responses:
        "200":
          description: Berhasil mengambil kategori
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
  /map:
    get:
      tags: [Map]
      summary: Daftar lokasi peta yang sudah dipublish
      security: []
      responses:
        "200":
          description: Berhasil mengambil data peta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapLocationListResponse"
  /map/{id}:
    get:
      tags: [Map]
      summary: Detail lokasi peta
      security: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Berhasil mengambil detail lokasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapLocationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /reports:
    get:
      tags: [Reports]
      summary: Daftar laporan milik user
      parameters:
        - in: query
          name: per_page
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Berhasil mengambil daftar laporan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [Reports]
      summary: Buat laporan baru
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/StoreReportRequest"
      responses:
        "201":
          description: Laporan berhasil dikirim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"
  /reports/{id}:
    get:
      tags: [Reports]
      summary: Detail laporan
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Berhasil mengambil detail laporan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: integer
  responses:
    ValidationError:
      description: Validasi gagal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    Unauthenticated:
      description: Autentikasi diperlukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    RegisterRequest:
      type: object
      required: [full_name, email, password, password_confirmation]
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    UpdateProfileRequest:
      type: object
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password
    StoreReportRequest:
      type: object
      required: [latitude, longitude, photo, categories]
      properties:
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        photo:
          type: string
          format: binary
        categories:
          type: array
          items:
            $ref: "#/components/schemas/ReportCategoryInput"
    ReportCategoryInput:
      type: object
      required: [id, available]
      properties:
        id:
          type: integer
        available:
          type: boolean
    SuccessMessage:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil
        data:
          nullable: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Terjadi kesalahan
        errors:
          nullable: true
    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            message:
              example: Validasi gagal.
            errors:
              type: object
    AuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login berhasil.
        data:
          type: object
          properties:
            token:
              type: string
            user:
              $ref: "#/components/schemas/User"
    ProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil mengambil profil.
        data:
          $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        user_id:
          type: integer
        full_name:
          type: string
        email:
          type: string
        role:
          type: string
        created_at:
          type: string
          format: date-time
    Category:
      type: object
      properties:
        category_id:
          type: integer
        facility_name:
          type: string
        icon_marker:
          type: string
    CategoryListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil mengambil kategori.
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    ReportDetail:
      type: object
      properties:
        category:
          type: string
        icon_marker:
          type: string
        availability_status:
          type: boolean
    Report:
      type: object
      properties:
        report_id:
          type: integer
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        photo_url:
          type: string
        timestamp:
          type: string
          format: date-time
        validation_status:
          type: string
          enum: [pending, approved, rejected]
        details:
          type: array
          items:
            $ref: "#/components/schemas/ReportDetail"
    ReportResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Laporan berhasil dikirim.
        data:
          $ref: "#/components/schemas/Report"
    ReportListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil mengambil daftar laporan.
        data:
          type: object
          properties:
            reports:
              type: array
              items:
                $ref: "#/components/schemas/Report"
            pagination:
              $ref: "#/components/schemas/Pagination"
    MapFacility:
      type: object
      properties:
        category:
          type: string
        icon_marker:
          type: string
        available:
          type: boolean
    MapLocation:
      type: object
      properties:
        location_id:
          type: integer
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        publish_date:
          type: string
          format: date-time
        photo_url:
          type: string
        reported_by:
          type: string
        facilities:
          type: array
          items:
            $ref: "#/components/schemas/MapFacility"
    MapLocationResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil mengambil detail lokasi.
        data:
          $ref: "#/components/schemas/MapLocation"
    MapLocationListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil mengambil data peta.
        data:
          type: array
          items:
            $ref: "#/components/schemas/MapLocation"
    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
